name: comic-diary

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - comic_diary_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    networks:
      - backend

  media-init:
    image: ${COMIC_DIARY_IMAGE:?COMIC_DIARY_IMAGE is required}
    user: "0:0"
    restart: "no"
    network_mode: "none"
    read_only: true

    command:
      [
        "sh",
        "-c",
        "mkdir -p /media/covers && chown -R 1001:1001 /media"
      ]

    volumes:
      - comic_diary_media:/media

    security_opt:
      - no-new-privileges:true

  app:
    image: ${COMIC_DIARY_IMAGE:?COMIC_DIARY_IMAGE is required}
    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_IMPORT_ENABLED: ${ADMIN_IMPORT_ENABLED:-false}
      COMIC_DIARY_PUBLIC_ORIGIN: ${COMIC_DIARY_PUBLIC_ORIGIN:?COMIC_DIARY_PUBLIC_ORIGIN is required}
      MEDIA_ROOT: /app/data/media
      NEXT_TELEMETRY_DISABLED: "1"
      # Recovery remains OFF unless the operator explicitly configures every gate.
      PASSWORD_RESET_REQUEST_ENABLED: ${PASSWORD_RESET_REQUEST_ENABLED:-false}
      PASSWORD_RESET_REQUEST_MAIL_READY: ${PASSWORD_RESET_REQUEST_MAIL_READY:-false}
      PASSWORD_RESET_REDEEM_ENABLED: ${PASSWORD_RESET_REDEEM_ENABLED:-false}
      AUTH_RECOVERY_WORKER_ENABLED: ${AUTH_RECOVERY_WORKER_ENABLED:-false}
      AUTH_RECOVERY_DISPATCH_ENABLED: ${AUTH_RECOVERY_DISPATCH_ENABLED:-false}
      AUTH_RECOVERY_SENDER_VERIFIED: ${AUTH_RECOVERY_SENDER_VERIFIED:-false}
      AUTH_RECOVERY_RESEND_CONFIG_READY: ${AUTH_RECOVERY_RESEND_CONFIG_READY:-false}
      AUTH_RECOVERY_FROM_ADDRESS: ${AUTH_RECOVERY_FROM_ADDRESS:-}
      AUTH_RECOVERY_SENDER_DOMAIN: ${AUTH_RECOVERY_SENDER_DOMAIN:-}
      AUTH_RECOVERY_PUBLIC_ORIGIN: ${AUTH_RECOVERY_PUBLIC_ORIGIN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      PASSWORD_RESET_OUTBOX_KEY_ID: ${PASSWORD_RESET_OUTBOX_KEY_ID:-}
      PASSWORD_RESET_OUTBOX_KEY_BASE64: ${PASSWORD_RESET_OUTBOX_KEY_BASE64:-}

      AUTH_LEGACY_EMAIL_VERIFICATION_ENABLED: ${AUTH_LEGACY_EMAIL_VERIFICATION_ENABLED:-false}
      AUTH_BETA_INVITATION_REGISTRATION_ENABLED: ${AUTH_BETA_INVITATION_REGISTRATION_ENABLED:-false}
      AUTH_BETA_INVITATION_DISPATCH_ENABLED: ${AUTH_BETA_INVITATION_DISPATCH_ENABLED:-false}
      AUTH_LEGACY_EMAIL_VERIFICATION_REQUEST_ENABLED: ${AUTH_LEGACY_EMAIL_VERIFICATION_REQUEST_ENABLED:-false}

      # Registration/activation is independent of recovery and remains default-OFF.
      # Operator values come from protected deployment interpolation, never Git literals.
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-false}
      REGISTRATION_ACTIVATION_REDEEM_ENABLED: ${REGISTRATION_ACTIVATION_REDEEM_ENABLED:-false}
      AUTH_ACTIVATION_RESEND_CONFIG_READY: ${AUTH_ACTIVATION_RESEND_CONFIG_READY:-false}
      AUTH_ACTIVATION_SENDER_VERIFIED: ${AUTH_ACTIVATION_SENDER_VERIFIED:-false}
      AUTH_ACTIVATION_DISPATCH_ENABLED: ${AUTH_ACTIVATION_DISPATCH_ENABLED:-false}
      AUTH_ACTIVATION_WORKER_ENABLED: ${AUTH_ACTIVATION_WORKER_ENABLED:-false}
      AUTH_ACTIVATION_OPERATOR_CONTROL_ENABLED: ${AUTH_ACTIVATION_OPERATOR_CONTROL_ENABLED:-false}
      AUTH_ACTIVATION_FROM_ADDRESS: ${AUTH_ACTIVATION_FROM_ADDRESS:-}
      AUTH_ACTIVATION_SENDER_DOMAIN: ${AUTH_ACTIVATION_SENDER_DOMAIN:-}
      AUTH_ACTIVATION_PUBLIC_ORIGIN: ${AUTH_ACTIVATION_PUBLIC_ORIGIN:-}
      AUTH_ACTIVATION_OUTBOX_KEY_ID: ${AUTH_ACTIVATION_OUTBOX_KEY_ID:-}
      AUTH_ACTIVATION_OUTBOX_KEY_BASE64: ${AUTH_ACTIVATION_OUTBOX_KEY_BASE64:-}

    ports:
      - "127.0.0.1:${COMIC_DIARY_HOST_PORT:-18082}:3000"

    volumes:
      - comic_diary_media:/app/data/media

    depends_on:
      db:
        condition: service_healthy

      media-init:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  comic_diary_media:
  comic_diary_pgdata:
