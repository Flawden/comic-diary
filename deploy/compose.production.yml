name: comic-diary

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}

    volumes:
      - comic_diary_pgdata:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

    networks:
      - backend

  app:
    image: ${COMIC_DIARY_IMAGE:?COMIC_DIARY_IMAGE is required}
    restart: unless-stopped
    init: true

    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      ADMIN_IMPORT_ENABLED: ${ADMIN_IMPORT_ENABLED:-false}
      ADMIN_IMPORT_SECRET: ${ADMIN_IMPORT_SECRET:-}
      NEXT_TELEMETRY_DISABLED: "1"

    ports:
      - "127.0.0.1:${COMIC_DIARY_HOST_PORT:-18082}:3000"

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  comic_diary_pgdata: