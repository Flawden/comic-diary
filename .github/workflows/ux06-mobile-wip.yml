name: UX-06 Mobile QA (WIP only)

on:
  push:
    branches:
      - feature/ux06-description-search-themes-wip

permissions:
  contents: read

concurrency:
  group: ux06-mobile-wip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mobile-visual:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout WIP
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install app dependencies
        run: npm ci
      - name: Install test-only Playwright
        run: |
          npm install --no-save --package-lock=false playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Start isolated demo server (fake local DB URL)
        shell: bash
        env:
          DATABASE_URL: postgresql://ux06_qa:ux06_qa@127.0.0.1:1/ux06_qa?connect_timeout=1
          NEXT_TELEMETRY_DISABLED: '1'
        run: |
          mkdir -p artifacts/ux06-mobile
          ./node_modules/.bin/next dev --hostname 127.0.0.1 --port 43861 > artifacts/ux06-mobile/next-server.txt 2>&1 &
          echo $! > /tmp/ux06-next.pid
          ready=0
          for attempt in $(seq 1 90); do
            if curl --silent --fail --max-time 5 'http://127.0.0.1:43861/ux06-qa?theme=tea' > /dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" != 1 ]; then
            echo 'QA_ROUTE_HTTP_200=FAIL'
            tail -80 artifacts/ux06-mobile/next-server.txt
            exit 1
          fi
          echo 'QA_ROUTE_HTTP_200=PASS'
      - name: Mobile browser geometry and screenshot checks
        run: node scripts/qa/ux06-mobile-ci.cjs
      - name: Upload screenshots and geometry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux06-mobile-wip-screenshots
          path: artifacts/ux06-mobile/
          if-no-files-found: warn
          retention-days: 7
