name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unread chapter confirmation regression
        run: node --import tsx --test src/modules/library/needs-unread-confirmation.test.ts

      - name: Canonical Origin and Host regression tests
        run: node --import tsx --test src/modules/auth/request-origin.test.ts

      - name: Optional work source URL rules
        run: node --import tsx --test src/catalog/validate-catalog.test.ts

      - name: Reading destination rules
        run: node --import tsx --test src/modules/comics/work-metadata.test.ts src/modules/library/reading-target.test.ts src/modules/library/list-navigation.test.ts src/modules/library/chapter-rating-summary.test.ts src/modules/library/chapter-reading-model.test.ts src/modules/catalog/chapter-release-dates.test.ts src/modules/catalog/chapter-volumes.test.ts src/modules/library/queries/reading-updates-model.test.ts

      - name: Check restore script syntax
        run: |
          bash -n deploy/scripts/CHECK_COMIC_DIARY_DB_RESTORE.sh
          bash -n deploy/scripts/CHECK_COMIC_DIARY_FULL_RESTORE.sh
          bash -n deploy/scripts/CHECK_COMIC_DIARY_RELEASE_STATUS.sh
          node --check deploy/scripts/CHECK_COMIC_DIARY_RESTORED_DIARY.cjs
          node --test deploy/scripts/restored-diary-check.test.cjs
          bash -n deploy/backup/install.sh
          bash -n deploy/keeper/install.sh

      - name: Managed backup lifecycle and retention tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/backup -p 'test*.py' -v

      - name: Telegram keeper notification and pairing tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/keeper -p test_keeper.py -v

      - name: BR01 VPS disk monitoring and safe image retention tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash -n deploy/disk-guard/install.sh
          python3 -m unittest discover -s deploy/disk-guard -p test_guard.py -v

      - name: BR02 post-deploy smoke logic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/postdeploy -p test_smoke.py -v

      - name: Restricted backup export tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/offhost -p 'test*.py' -v

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Docker verification image
        run: docker build -t comic-diary:ci .

  windows-backup-client:
    name: Windows backup client
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Windows PowerShell 5.1 archive, hash and binary transport checks
        shell: powershell
        run: ./deploy/offhost/Test-WindowsPull.ps1

  database:
    name: PostgreSQL release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comic_diary_release
          POSTGRES_USER: comic_diary_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comic_diary_ci -d comic_diary_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate clean database and verify repeat migration
        run: |
          node scripts/migrate-production.mjs
          node scripts/migrate-production.mjs

      - name: Verify optional comic source URL migration
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const { rows } = await pool.query("SELECT is_nullable FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'comics' AND column_name = 'source_url'");
            assert.deepEqual(rows, [{ is_nullable: 'YES' }]);
            console.log('OPTIONAL_COMIC_SOURCE_URL_SCHEMA=PASS');
          } finally { await pool.end(); }
          JS

      - name: Seed disposable database twice
        run: |
          node --import tsx scripts/seed.ts
          node --import tsx scripts/seed.ts
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const { rows } = await pool.query(`
              SELECT ch.status, count(*)::int AS count FROM chapters ch
              JOIN comics c ON c.id = ch.comic_id
              WHERE c.slug = 'r85-catalog-demo' GROUP BY ch.status ORDER BY ch.status
            `);
            assert.deepEqual(rows, [
              { status: 'SCHEDULED', count: 1 },
              { status: 'RELEASED', count: 3 },
              { status: 'ARCHIVED', count: 1 },
            ]);
            console.log('REPEATED_SEED_FIXTURE=PASS');
          } finally { await pool.end(); }
          JS

      - name: Reading, revisions and chapter workflows
        run: |
          node --import tsx scripts/chapter-reading-probe.ts
          node --import tsx scripts/chapter-batch-probe.ts
          node --import tsx scripts/chapter-move-probe.ts
          node --import tsx scripts/series-publication-probe.ts

      - name: Library membership, account counters and diary export
        run: |
          node --import tsx scripts/chapter-rating-probe.ts
          node --import tsx scripts/library-membership-probe.ts
          node --import tsx scripts/collection-progress-probe.ts
          node --import tsx scripts/account-reading-stats-probe.ts
          node --import tsx scripts/account-diary-export-probe.ts

      - name: Personal mutation and shared catalog authorization contracts
        run: |
          node --import tsx scripts/auth-personal-mutation-authorization-probe.ts
          node --import tsx scripts/auth-shared-catalog-authorization-probe.ts

      - name: Mobile reader in Chrome
        timeout-minutes: 8
        run: |
          export WD_BROWSER_ROOT="$RUNNER_TEMP/wd-browser"
          npm install --prefix "$WD_BROWSER_ROOT" --no-audit --no-fund playwright-core@1.56.1
          ./node_modules/.bin/next dev --webpack -H 127.0.0.1 -p 3102 > "$RUNNER_TEMP/wd-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused http://127.0.0.1:3102/login -o /dev/null
          node --input-type=module <<'JS'
          const response = await fetch('http://127.0.0.1:3102/api/health/ready');
          const data = await response.json();
          if (!response.ok || data.status !== 'ready') {
            throw new Error('BR02 database readiness route failed in CI');
          }
          console.log('BR02_CI_READINESS=PASS');
          JS
          export WD_VISUAL_OUTPUT="$RUNNER_TEMP/wd-visual"
          mkdir -p "$WD_VISUAL_OUTPUT"
          node scripts/work-reader-browser.mjs || { tail -60 "$RUNNER_TEMP/wd-next.log"; exit 1; }
          export ADMIN_CORE_OUTPUT="$RUNNER_TEMP/admin-core-01"
          mkdir -p "$ADMIN_CORE_OUTPUT"
          node scripts/admin-core-browser.mjs || { tail -60 "$RUNNER_TEMP/wd-next.log"; exit 1; }

      - name: Upload WD-HERO-02B visual QA and sanitized browser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wd-hero-02b-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/wd-visual/*.png
            ${{ runner.temp }}/wd-visual/*.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload ADMIN-CORE-01 admin journey diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-core-01-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/admin-core-01/*.json
            ${{ runner.temp }}/admin-core-01/*.png
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish immutable image
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - verify
      - database
      - windows-backup-client

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      digest: ${{ steps.publish.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          printf '%s\n' "$GHCR_TOKEN" |
            docker login ghcr.io \
              --username "${{ github.actor }}" \
              --password-stdin

      - name: Build release image
        run: |
          set -euo pipefail

          docker build \
            --build-arg "COMIC_DIARY_BUILD_SHA=$GITHUB_SHA" \
            -t comic-diary:release \
            .

      - name: Publish and verify immutable image
        id: publish
        env:
          IMAGE_REPOSITORY: ghcr.io/flawden/comic-diary
        run: |
          set -euo pipefail

          sha_tag="$IMAGE_REPOSITORY:$GITHUB_SHA"
          master_tag="$IMAGE_REPOSITORY:master"

          docker tag \
            comic-diary:release \
            "$sha_tag"

          docker tag \
            comic-diary:release \
            "$master_tag"

          docker push \
            "$sha_tag"

          docker push \
            "$master_tag"

          docker pull \
            "$sha_tag"

          sha_ref="$(
            docker image inspect \
              "$sha_tag" \
              --format '{{index .RepoDigests 0}}'
          )"

          docker pull \
            "$master_tag"

          master_ref="$(
            docker image inspect \
              "$master_tag" \
              --format '{{index .RepoDigests 0}}'
          )"

          if [ -z "$sha_ref" ]; then
            echo "ERROR: SHA image has no repository digest"
            exit 1
          fi

          if [ "$sha_ref" != "$master_ref" ]; then
            echo "ERROR: SHA and master tags differ"
            echo "sha=$sha_ref"
            echo "master=$master_ref"
            exit 1
          fi

          digest="${sha_ref#*@}"

          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid published digest: $digest"
            exit 1
          fi

          echo "digest=$digest" \
            >> "$GITHUB_OUTPUT"

          echo "GHCR_SHA_TAG=$sha_tag"
          echo "GHCR_SHA_REF=$sha_ref"
          echo "GHCR_DIGEST=$digest"

          {
            echo "### Published Comic Diary container"
            echo
            echo "Commit:"
            echo
            echo "\`$GITHUB_SHA\`"
            echo
            echo "Immutable image:"
            echo
            echo "\`$sha_ref\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of GitHub Container Registry
        if: always()
        run: |
          docker logout ghcr.io \
            >/dev/null 2>&1 \
            || true

  deploy:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - publish

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    concurrency:
      group: comic-diary-production
      cancel-in-progress: false

    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      RELEASE_DIGEST: ${{ needs.publish.outputs.digest }}
      PRODUCTION_BASE_URL: ${{ vars.PRODUCTION_BASE_URL }}

    steps:
      - name: Checkout repository for post-deploy smoke
        uses: actions/checkout@v5

      - name: Validate deployment contract
        run: |
          set -euo pipefail

          : "${DEPLOY_HOST:?DEPLOY_HOST is missing}"
          : "${DEPLOY_PORT:?DEPLOY_PORT is missing}"
          : "${DEPLOY_USER:?DEPLOY_USER is missing}"
          : "${RELEASE_DIGEST:?release digest is missing}"
          : "${PRODUCTION_BASE_URL:?Set the PRODUCTION_BASE_URL GitHub Actions variable to the HTTPS public origin before deployment}"

          if [[ ! "$DEPLOY_PORT" =~ ^[0-9]+$ ]]; then
            echo "ERROR: invalid DEPLOY_PORT"
            exit 1
          fi

          if [[ ! "$GITHUB_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "ERROR: invalid GITHUB_SHA"
            exit 1
          fi

          if [[ ! "$RELEASE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "ERROR: invalid release digest"
            exit 1
          fi

          echo "commit=$GITHUB_SHA"
          echo "digest=$RELEASE_DIGEST"
          echo "deploy-contract=PASS"

      - name: Install restricted SSH identity
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          : "${DEPLOY_SSH_PRIVATE_KEY:?DEPLOY_SSH_PRIVATE_KEY is missing}"
          : "${DEPLOY_KNOWN_HOSTS:?DEPLOY_KNOWN_HOSTS is missing}"

          install \
            -d \
            -m 0700 \
            "$HOME/.ssh"

          umask 077

          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" \
            > "$HOME/.ssh/comic-diary-deploy"

          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" \
            > "$HOME/.ssh/known_hosts"

          chmod \
            0600 \
            "$HOME/.ssh/comic-diary-deploy" \
            "$HOME/.ssh/known_hosts"

          ssh-keygen \
            -y \
            -f "$HOME/.ssh/comic-diary-deploy" \
            >/dev/null

          echo "ssh-material=PASS"

      - name: Probe restricted production gate
        run: |
          set -euo pipefail

          ssh \
            -T \
            -i "$HOME/.ssh/comic-diary-deploy" \
            -p "$DEPLOY_PORT" \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o ConnectTimeout=15 \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            probe

      - name: Deploy exact commit and digest
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          : "${GHCR_TOKEN:?GitHub package token is missing}"

          printf '%s\n' "$GHCR_TOKEN" |
            ssh \
              -T \
              -i "$HOME/.ssh/comic-diary-deploy" \
              -p "$DEPLOY_PORT" \
              -o IdentitiesOnly=yes \
              -o BatchMode=yes \
              -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -o ConnectTimeout=15 \
              -o ServerAliveInterval=15 \
              -o ServerAliveCountMax=8 \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              "deploy $GITHUB_SHA $RELEASE_DIGEST"

      - name: BR02 verify public production and exact commit
        timeout-minutes: 6
        run: |
          python3 deploy/postdeploy/smoke.py \
            --url "$PRODUCTION_BASE_URL" \
            --expected-sha "$GITHUB_SHA" \
            --attempts 18 \
            --delay-seconds 6

      - name: Record successful production deployment
        run: |
          {
            echo "### Production deployment"
            echo
            echo "Commit:"
            echo
            echo "\`$GITHUB_SHA\`"
            echo
            echo "Digest:"
            echo
            echo "\`$RELEASE_DIGEST\`"
            echo
            echo "Public readiness, catalog and login smoke: **PASS**"
            echo
            echo "Result: **PASS**"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove SSH material
        if: always()
        run: |
          rm -f \
            "$HOME/.ssh/comic-diary-deploy" \
            "$HOME/.ssh/known_hosts" \
            2>/dev/null \
            || true
