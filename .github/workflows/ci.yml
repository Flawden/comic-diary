name: CI

on:
  push:
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Production Compose AUTH configuration contract (no containers or secrets)
        run: node --test deploy/compose-auth-contract.test.mjs

      - name: COMMUNITY-01 policy and boundary contracts
        run: node --import tsx --test src/modules/community/policy.test.ts scripts/community01-contract.test.mjs

      - name: Closed beta invitation policy (default OFF)
        run: node --import tsx --test src/modules/auth/beta-invitation-policy.test.ts src/modules/auth/site-access-policy.test.ts

      - name: Public reviews validation and boundary contracts
        run: node --import tsx --test src/modules/community/review-policy.test.ts src/modules/community/chapter-rating-policy.test.ts scripts/reviews-contract.test.mjs

      - name: Work presentation metadata and honest progress policy
        run: node --import tsx --test src/modules/catalog/work-presentation-policy.test.ts src/modules/catalog/chapter-measures.test.ts

      - name: COMMUNITY threaded reply grouping regression
        run: node --import tsx --test src/modules/community/thread-model.test.ts

      - name: RATE-01 public ratings unit and boundary contracts
        run: node --import tsx --test src/modules/library/ratings/community-rating.test.ts scripts/rate01-contract.test.mjs

      - name: Integrated live design and migration lineage contracts
        run: node --test scripts/integration-design-contract.test.mjs

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Password reset token and schema contract regressions
        run: |
          node --import tsx --test src/modules/auth/password-reset-token.test.ts
          node --test scripts/auth-password-reset-schema-contract.test.mjs
          node --test scripts/auth-password-reset-b2-contract.test.mjs
          node --import tsx --test src/modules/auth/password-reset-http.test.ts
          node --test scripts/auth-password-reset-c1-contract.test.mjs
          node --test scripts/auth-password-reset-c2a-contract.test.mjs

      - name: AUTH-01C2B email verification local contracts and policy
        run: |
          node --test scripts/auth-email-verification-c2b1-contract.test.mjs scripts/auth-email-verification-c2b2-contract.test.mjs scripts/auth-email-verification-c2b3-contract.test.mjs
          node --import tsx --test src/modules/auth/email-verification-token.test.ts src/modules/auth/email-verification-policy.test.ts

      - name: One-shot activation pilot policy and schema contracts
        run: node --import tsx --test src/modules/auth/activation-mail-pilot.test.ts scripts/auth-activation-pilot-contract.test.mjs

      - name: Verification purpose additive schema contract
        run: node --test scripts/auth-verification-purpose-contract.test.mjs

      - name: Legacy verification purpose, AEAD and mail isolation
        run: node --import tsx --test src/modules/auth/verification-purpose.test.ts scripts/auth-legacy-email-verification-contract.test.mjs

      - name: AUTH-01C2B4A registration activation model contracts
        run: |
          node --test scripts/auth-registration-c2b4a-contract.test.mjs scripts/auth-registration-c2b4b-contract.test.mjs scripts/auth-registration-c2b4c-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-policy.test.ts

      - name: AUTH-01C2B4 browser fixture activation regression
        run: node --test scripts/auth-registration-c2b4abc-browser-fixture-contract.test.mjs

      - name: AUTH-01C2B4D1 disabled activation HTTP boundary and limits
        run: |
          node --test scripts/auth-registration-c2b4d1-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-http.test.ts

      - name: AUTH-01C2B4D2A safe activation mail contract (no sending)
        run: |
          node --test scripts/auth-registration-c2b4d2a-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-mail.test.ts

      - name: AUTH-01C2B4D2B1 inert sender envelope validation (no delivery)
        run: |
          node --test scripts/auth-registration-c2b4d2b1-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-sender.test.ts

      - name: AUTH-01C2B4D2B2A inert Resend candidate wire contract (no network)
        run: |
          node --test scripts/auth-registration-c2b4d2b2a-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-resend-contract.test.ts
      - name: AUTH-01 R1C2C5 recovery Resend one-shot test adapter (MOCK HTTP ONLY)
        run: |
          node --import tsx --test src/modules/auth/password-reset-request-resend-test-adapter.test.ts
          node --test scripts/auth-r1c2c5-resend-inert-contract.test.mjs
      - name: AUTH-01 R1C2C6 inert recovery Resend runtime config (NO SECRETS/NETWORK)
        run: |
          node --import tsx --test src/modules/auth/password-reset-request-resend-runtime-config.test.ts
          node --test scripts/auth-r1c2c6-resend-config-inert-contract.test.mjs

      - name: AUTH-01 R1C2C7 outcome bridge contract (NO mail)
        run: node --test scripts/auth-r1c2c7-inert-bridge-contract.test.mjs

      - name: AUTH-01 abandoned recovery SQL and concurrency coverage contracts
        run: node --test scripts/auth-dispatch-recovery-contract.test.mjs

      - name: Activation runtime readiness and integrated dispatch contracts
        run: node --import tsx --test src/modules/auth/registration-activation-config.test.ts scripts/auth-activation-dispatch-contract.test.mjs

      - name: AUTH-01 claim-only runtime and fence/reservation contracts (NO legacy settlement)
        run: |
          node --test scripts/auth-r1c2b2-recovery-claim-contract.test.mjs
          node --test scripts/auth-r1c2c2-recovery-fence-contract.test.mjs
          node --test scripts/auth-r1c2c3-recovery-reserve-contract.test.mjs

      - name: AUTH-01C2B4D2B2B inert outbox outcome policy (no persistence or sending)
        run: |
          node --test scripts/auth-registration-c2b4d2b2b-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-outbox-policy.test.ts

      - name: AUTH-01C2B4D2C1 inert durable outbox schema contracts (no dispatcher)
        run: node --test scripts/auth-registration-c2b4d2c1-contract.test.mjs

      - name: AUTH-01C2B4D2C2 AEAD outbox payload contract (no persistence or mail)
        run: |
          node --test scripts/auth-registration-c2b4d2c2-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-outbox-crypto.test.ts

      - name: AUTH-01C2B4D2C3 atomic encrypted enqueue contract (no delivery)
        run: node --test scripts/auth-registration-c2b4d2c3-contract.test.mjs

      - name: AUTH-01C2B4D2C4A internal claim and finalization contract (no delivery)
        run: node --test scripts/auth-registration-c2b4d2c4-contract.test.mjs

      - name: AUTH-01C2B4D2C4B1 offline snapshot preflight (NO DB or sending)
        run: node --import tsx --test src/modules/auth/registration-activation-outbox-dry-run.test.ts

      - name: AUTH-01C2B4D2C4B2 persisted idempotency compatibility (NO network or sending)
        run: |
          node --test scripts/auth-registration-c2b4d2c4b2-contract.test.mjs
          node --import tsx --test src/modules/auth/registration-activation-resend-contract.test.ts

      - name: AUTH-01C2B4D2C4B3A offline revocation race contract (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3a-race-contract.test.mjs

      - name: AUTH-01C2B4D2C4B3B1 offline fence semantics (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3b1-fence-spec.test.mjs

      - name: AUTH-01C2B4D2C4B3B2 durable DB dispatch fence contract (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3b2-contract.test.mjs

      - name: AUTH-01C2B4D2C4B3B3A offline operator gate and uncertain-outcome semantics (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3b3a-control-spec.test.mjs

      - name: AUTH-01C2B4D2C4B3B3B durable operator gate contract (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3b3b-contract.test.mjs

      - name: AUTH-01C2B4D2C4B3B3C operator transitions offline contract (NO delivery)
        run: node --test scripts/auth-registration-c2b4d2c4b3b3c-contract.test.mjs

      - name: AUTH-01 D1 user-facing activation and recovery UI contract (NO mail)
        run: node --test scripts/auth-user-flows-d1-contract.test.mjs

      - name: AUTH-01 D1 browser QA source contract (NO mail)
        run: node --test scripts/auth-d1-browser-qa-contract.test.mjs

      - name: Unread chapter confirmation regression
        run: node --import tsx --test src/modules/library/needs-unread-confirmation.test.ts

      - name: Avatar decoding, crop, metadata stripping and image limits
        run: node --import tsx --test src/modules/appearance/avatar-storage.test.ts

      - name: Canonical Origin and Host regression tests
        run: node --import tsx --test src/modules/auth/request-origin.test.ts

      - name: Optional work source URL rules
        run: node --import tsx --test src/catalog/validate-catalog.test.ts

      - name: Advanced chapter batch input validation and volume placement
        run: node --import tsx --test src/modules/catalog/chapter-structured-batch.test.ts src/modules/catalog/chapter-placement.test.ts

      - name: Reading destination rules
        run: node --import tsx --test src/modules/comics/work-metadata.test.ts src/modules/library/reading-target.test.ts src/modules/library/list-navigation.test.ts src/modules/library/chapter-rating-summary.test.ts src/modules/library/chapter-reading-model.test.ts src/modules/catalog/chapter-release-dates.test.ts src/modules/catalog/chapter-volumes.test.ts src/modules/library/queries/reading-updates-model.test.ts

      - name: Check restore script syntax
        run: |
          bash -n deploy/scripts/CHECK_COMIC_DIARY_DB_RESTORE.sh
          bash -n deploy/scripts/CHECK_COMIC_DIARY_FULL_RESTORE.sh
          bash -n deploy/scripts/CHECK_COMIC_DIARY_RELEASE_STATUS.sh
          node --check deploy/scripts/CHECK_COMIC_DIARY_RESTORED_DIARY.cjs
          node --test deploy/scripts/restored-diary-check.test.cjs
          bash -n deploy/backup/install.sh
          bash -n deploy/keeper/install.sh

      - name: Managed backup lifecycle and retention tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/backup -p 'test*.py' -v

      - name: Telegram keeper notification and pairing tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/keeper -p test_keeper.py -v

      - name: BR01 VPS disk monitoring and safe image retention tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          bash -n deploy/disk-guard/install.sh
          python3 -m unittest discover -s deploy/disk-guard -p test_guard.py -v

      - name: BR02 post-deploy smoke logic tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/postdeploy -p test_smoke.py -v

      - name: Restricted backup export tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s deploy/offhost -p 'test*.py' -v

      - name: Build application
        run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Build Docker verification image
        run: docker build -t comic-diary:ci .

  windows-backup-client:
    name: Windows backup client
    runs-on: windows-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
      - name: Windows PowerShell 5.1 archive, hash and binary transport checks
        shell: powershell
        run: ./deploy/offhost/Test-WindowsPull.ps1

  database:
    name: PostgreSQL release checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: comic_diary_release
          POSTGRES_USER: comic_diary_ci
          POSTGRES_PASSWORD: ci_ephemeral_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U comic_diary_ci -d comic_diary_release"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate clean database and verify repeat migration
        run: |
          node scripts/migrate-production.mjs
          node scripts/migrate-production.mjs

      - name: Verification purpose upgrade and backward compatibility (isolated PG17 database)
        env:
          PURPOSE_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/auth-verification-purpose-pg.test.ts

      - name: AUTH-01B2 disposable PostgreSQL security and concurrency probe
        run: node --import tsx scripts/auth-password-reset-probe.ts

      - name: AUTH-01C1 disposable PostgreSQL HTTP boundary probe
        run: node --import tsx scripts/auth-password-reset-c1-api-probe.ts

      - name: AUTH-01C2B3 disposable PostgreSQL mailbox verification probe
        run: node --import tsx scripts/auth-email-verification-c2b3-probe.ts

      - name: AUTH-01C2B4C disposable PostgreSQL pending-account activation probe
        run: node --import tsx scripts/auth-registration-c2b4c-probe.ts

      - name: AUTH-01C2B4D2C1 disposable PostgreSQL outbox constraints and claim race
        run: node --import tsx scripts/auth-registration-c2b4d2c1-pg-probe.ts

      - name: AUTH-01C2B4D2C3 disposable PostgreSQL atomic enqueue and rollback
        run: node --import tsx scripts/auth-registration-c2b4d2c3-pg-probe.ts
      - name: AUTH-01 R1B2C disposable PostgreSQL recovery enqueue rollback and race (NO delivery)
        run: node --import tsx scripts/auth-r1b2c-recovery-pg-probe.ts
      - name: AUTH-01 R1C2B2 disposable PostgreSQL exclusive recovery claim (NO mail)
        run: node --import tsx scripts/auth-r1c2b2-recovery-claim-pg-probe.ts
      - name: AUTH-01 R1C2C2 disposable PostgreSQL recovery dispatch fence (NO mail)
        run: node --import tsx scripts/auth-r1c2c2-recovery-fence-pg-probe.ts
      - name: AUTH-01 R1C2C3 disposable PostgreSQL recovery operator reservation (NO mail)
        run: node --import tsx scripts/auth-r1c2c3-recovery-reserve-pg-probe.ts
      - name: AUTH-01 R1C2C4 provider outcome and reservation contracts (NO mail)
        run: node --import tsx --test src/modules/auth/password-reset-request-provider-outcome.test.ts scripts/auth-r1c2c4-outcome-contract.test.mjs
      - name: AUTH-01 R1C2C4 disposable PostgreSQL reserved outcome finalization (NO mail)
        run: node --import tsx scripts/auth-r1c2c4-recovery-finalize-pg-probe.ts

      - name: COMMUNITY-01 transactional comments and moderation (disposable PG)
        env:
          COMMUNITY01_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/community01-integration.test.ts

      - name: Reviews additive upgrade, concurrency, reactions and rollback
        env:
          REVIEWS_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          node --import tsx --test scripts/reviews-migration.test.ts
          node --import tsx --test scripts/reviews-integration.test.ts

      - name: RATE-01 set-based ratings integration (disposable PostgreSQL)
        env:
          RATE01_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/rate01-integration.test.ts

      - name: Work presentation migration, permissions, concurrency and equal-reader volumes
        env:
          PRESENTATION_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          node --import tsx --test scripts/work-presentation-migration.test.ts
          node --import tsx --test scripts/work-presentation-integration.test.ts

      - name: AUTH activation integrated registration and mock dispatch
        env:
          ACTIVATION_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/auth-activation-integration.test.ts

      - name: Legacy email verification HTTP, concurrency and mock dispatch
        env:
          LEGACY_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/auth-legacy-email-verification-integration.test.ts

      - name: One-shot legacy pilot concurrency and fault injection (mock HTTP only)
        env:
          PILOT_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          node --import tsx --test scripts/auth-activation-pilot-migration.test.ts
          node --import tsx --test scripts/auth-activation-pilot-integration.test.ts

      - name: AUTH-01 integrated recovery dispatch (disposable PostgreSQL and MOCK HTTP)
        env:
          AUTH01_DISPATCH_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: node --import tsx --test scripts/auth-dispatch-integration.test.ts
      - name: AUTH-01 R1C1 password reset request configuration (OFF by default)
        run: node --import tsx --test src/modules/auth/password-reset-request-config.test.ts
      - name: AUTH-01 R1C2A pure password reset outbox lifecycle policy (NO mail)
        run: node --import tsx --test scripts/auth-r1c2a-recovery-outbox-policy.test.mjs
      - name: AUTH-01 R1C2C1 pure password reset mail AEAD snapshot preflight (NO send)
        run: node --import tsx --test src/modules/auth/password-reset-request-outbox-preflight.test.ts
      - name: AUTH-01 R1C2B1 recovery claim schema contract (NO delivery)
        run: node --test scripts/auth-r1c2b1-recovery-claim-schema.test.mjs

      - name: AUTH-01C2B4D2C4A disposable PostgreSQL claim and terminal states
        run: node --import tsx scripts/auth-registration-c2b4d2c4-pg-probe.ts

      - name: AUTH-01C2B4D2C4B3B2 disposable PostgreSQL fence concurrency (NO delivery)
        run: node --import tsx scripts/auth-registration-c2b4d2c4b3b2-pg-probe.ts

      - name: AUTH-01C2B4D2C4B3B3B disposable PostgreSQL operator gate races (NO delivery)
        run: node --import tsx scripts/auth-registration-c2b4d2c4b3b3b-pg-probe.ts

      - name: AUTH-01C2B4D2C4B3B3C disposable PostgreSQL operator transitions (NO delivery)
        run: node --import tsx scripts/auth-registration-c2b4d2c4b3b3c-pg-probe.ts

      - name: Verify optional comic source URL migration
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const { rows } = await pool.query("SELECT is_nullable FROM information_schema.columns WHERE table_schema = 'public' AND table_name = 'comics' AND column_name = 'source_url'");
            assert.deepEqual(rows, [{ is_nullable: 'YES' }]);
            console.log('OPTIONAL_COMIC_SOURCE_URL_SCHEMA=PASS');
          } finally { await pool.end(); }
          JS

      - name: Seed disposable database twice
        run: |
          node --import tsx scripts/seed.ts
          node --import tsx scripts/seed.ts
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import pg from 'pg';
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          try {
            const { rows } = await pool.query(`
              SELECT ch.status, count(*)::int AS count FROM chapters ch
              JOIN comics c ON c.id = ch.comic_id
              WHERE c.slug = 'r85-catalog-demo' GROUP BY ch.status ORDER BY ch.status
            `);
            assert.deepEqual(rows, [
              { status: 'SCHEDULED', count: 1 },
              { status: 'RELEASED', count: 3 },
              { status: 'ARCHIVED', count: 1 },
            ]);
            console.log('REPEATED_SEED_FIXTURE=PASS');
          } finally { await pool.end(); }
          JS

      - name: Reading, revisions and chapter workflows
        run: |
          node --import tsx scripts/chapter-reading-probe.ts
          node --import tsx scripts/chapter-batch-probe.ts
          node --import tsx scripts/chapter-move-probe.ts
          node --import tsx scripts/series-publication-probe.ts

      - name: Library membership, account counters and diary export
        run: |
          node --import tsx scripts/chapter-rating-probe.ts
          node --import tsx scripts/library-membership-probe.ts
          node --import tsx scripts/collection-progress-probe.ts
          node --import tsx scripts/account-reading-stats-probe.ts
          node --import tsx scripts/account-diary-export-probe.ts

      - name: Personal mutation and shared catalog authorization contracts
        run: |
          node --import tsx scripts/auth-personal-mutation-authorization-probe.ts
          node --import tsx scripts/auth-shared-catalog-authorization-probe.ts

      - name: Beta invitation upgrade, concurrency, revocation and mock dispatch
        env:
          BETA_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          node --import tsx --test scripts/beta-invitations-migration.test.ts
          node --import tsx --test scripts/beta-invitations-integration.test.ts

      - name: Avatar additive upgrade, beta exclusivity, concurrency and account preservation
        env:
          APPEARANCE_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          node --import tsx --test scripts/appearance-migration.test.ts
          node --import tsx --test scripts/site-access-migration.test.ts
          node --import tsx --test scripts/appearance-integration.test.ts

      - name: Mobile reader in Chrome
        timeout-minutes: 8
        run: |
          export WD_BROWSER_ROOT="$RUNNER_TEMP/wd-browser"
          npm install --prefix "$WD_BROWSER_ROOT" --no-audit --no-fund playwright-core@1.56.1
          ./node_modules/.bin/next dev --webpack -H 127.0.0.1 -p 3102 > "$RUNNER_TEMP/wd-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused http://127.0.0.1:3102/login -o /dev/null
          node --input-type=module <<'JS'
          const response = await fetch('http://127.0.0.1:3102/api/health/ready');
          const data = await response.json();
          if (!response.ok || data.status !== 'ready') {
            throw new Error('BR02 database readiness route failed in CI');
          }
          console.log('BR02_CI_READINESS=PASS');
          JS
          export WD_VISUAL_OUTPUT="$RUNNER_TEMP/wd-visual"
          mkdir -p "$WD_VISUAL_OUTPUT"
          node scripts/work-reader-browser.mjs || { tail -60 "$RUNNER_TEMP/wd-next.log"; exit 1; }
          export ADMIN_CORE_OUTPUT="$RUNNER_TEMP/admin-core-01"
          export ADMIN_CHAPTER_VISUAL_CAPTURE=1
          mkdir -p "$ADMIN_CORE_OUTPUT"
          node scripts/admin-core-browser.mjs || { tail -60 "$RUNNER_TEMP/wd-next.log"; exit 1; }

      - name: AUTH-01 D1 isolated browser QA OFF-only (Chrome; NO mail)
        timeout-minutes: 8
        env:
          REGISTRATION_ACTIVATION_REDEEM_ENABLED: "false"
          PASSWORD_RESET_REDEEM_ENABLED: "false"
        run: |
          set -euo pipefail
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          npm install --prefix "$WD_BROWSER_ROOT" --no-audit --no-fund playwright-core@1.56.1
          ./node_modules/.bin/next dev --webpack -H 127.0.0.1 -p 3103 > "$RUNNER_TEMP/d1-next.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused http://127.0.0.1:3103/login -o /dev/null
          export D1_QA_ORIGIN="http://127.0.0.1:3103"
          export D1_QA_OUTPUT="$RUNNER_TEMP/d1-auth-browser"
          mkdir -p "$D1_QA_OUTPUT"
          node scripts/auth-d1-browser-qa.mjs || { tail -60 "$RUNNER_TEMP/d1-next.log"; exit 1; }

      - name: Upload AUTH-01 D1 browser QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth01-d1-browser-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/d1-auth-browser/*.png
            ${{ runner.temp }}/d1-auth-browser/manifest.json
          if-no-files-found: ignore
          retention-days: 7

      - name: AUTH-01 integrated recovery browser acceptance (ALL provider HTTP BLOCKED)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          npm run build
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          for mode in enabled disabled; do
            export AUTH01_BROWSER_MODE="$mode"
            if [ "$mode" = enabled ]; then port=3108; else port=3109; fi
            export AUTH01_BROWSER_ORIGIN="http://127.0.0.1:$port"
            node scripts/auth-recovery-browser-server.mjs > "$RUNNER_TEMP/auth-recovery-$mode.log" 2>&1 &
            qa_pid=$!
            trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
            curl -fsS --retry 25 --retry-delay 1 --retry-connrefused "$AUTH01_BROWSER_ORIGIN/login" -o /dev/null
            node scripts/auth-recovery-browser.mjs
            kill "$qa_pid"
            wait "$qa_pid" || true
            trap - EXIT
          done

      - name: Legacy verification profile browser acceptance (real APIs, provider HTTP blocked)
        timeout-minutes: 8
        run: |
          set -euo pipefail
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          for mode in enabled disabled; do
            export LEGACY_BROWSER_MODE="$mode"
            if [ "$mode" = enabled ]; then port=3110; else port=3111; fi
            node scripts/auth-legacy-browser-server.mjs > "$RUNNER_TEMP/legacy-$mode.log" 2>&1 &
            legacy_pid=$!
            trap 'kill "$legacy_pid" 2>/dev/null || true' EXIT
            curl -fsS --retry 25 --retry-delay 1 --retry-connrefused "http://127.0.0.1:$port/login" -o /dev/null
            node --import tsx scripts/auth-legacy-browser.mjs
            kill "$legacy_pid"
            wait "$legacy_pid" || true
            trap - EXIT
          done

      - name: Reviews and chapter modals in three themes (synthetic accounts only)
        timeout-minutes: 8
        env:
          REVIEWS_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
          PRESENTATION_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
          RELEASE25_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          set -euo pipefail
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          export REVIEWS_QA_ORIGIN="http://127.0.0.1:3106"
          export REVIEWS_QA_OUTPUT="$RUNNER_TEMP/reviews-browser"
          ./node_modules/.bin/next dev --webpack -H 127.0.0.1 -p 3106 > "$RUNNER_TEMP/reviews-next.log" 2>&1 &
          reviews_pid=$!
          trap 'kill "$reviews_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused "$REVIEWS_QA_ORIGIN/login" -o /dev/null
          node scripts/reviews-browser.mjs || { tail -60 "$RUNNER_TEMP/reviews-next.log"; exit 1; }
          export PRESENTATION_BROWSER_OUTPUT="$RUNNER_TEMP/work-presentation-browser"
          node scripts/work-presentation-browser.mjs || { tail -60 "$RUNNER_TEMP/reviews-next.log"; exit 1; }
          export RELEASE25_BROWSER_OUTPUT="$RUNNER_TEMP/release25-reader-browser"
          node scripts/release25-reader-browser.mjs || { tail -60 "$RUNNER_TEMP/reviews-next.log"; exit 1; }

      - name: Closed beta real browser registration and ADMIN invitations (mock mail only)
        timeout-minutes: 6
        env:
          BETA_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          set -euo pipefail
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          export BETA_BROWSER_OUTPUT="$RUNNER_TEMP/beta-invitations-browser"
          node scripts/beta-invitations-browser-server.mjs > "$RUNNER_TEMP/beta-invitations-host.log" 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused http://127.0.0.1:3116/register -o /dev/null
          node --import tsx scripts/beta-invitations-browser.mjs || { tail -40 "$RUNNER_TEMP/beta-invitations-host.log"; exit 1; }

      - name: Upload closed beta invitation visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: beta-invitations-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/beta-invitations-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Avatar upload and beta frame browser acceptance (no provider HTTP)
        timeout-minutes: 6
        env:
          APPEARANCE_TEST_DATABASE_URL: postgresql://comic_diary_ci:ci_ephemeral_password@127.0.0.1:5432/comic_diary_release
        run: |
          set -euo pipefail
          export WD_BROWSER_ROOT="$RUNNER_TEMP/d1-browser-deps"
          export APPEARANCE_BROWSER_OUTPUT="$RUNNER_TEMP/appearance-browser"
          export APPEARANCE_TEST_MEDIA_ROOT="$RUNNER_TEMP/appearance-media"
          node scripts/appearance-browser-server.mjs > "$RUNNER_TEMP/appearance-host.log" 2>&1 &
          qa_pid=$!
          trap 'kill "$qa_pid" 2>/dev/null || true' EXIT
          curl -fsS --retry 25 --retry-delay 1 --retry-connrefused http://127.0.0.1:3118/login -o /dev/null
          node scripts/appearance-browser.mjs || { tail -40 "$RUNNER_TEMP/appearance-host.log"; exit 1; }

      - name: Upload avatar and beta frame visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appearance-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/appearance-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload release reader resilience acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release25-reader-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/release25-reader-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload work presentation visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: work-presentation-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/work-presentation-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reviews visual acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reviews-browser-${{ github.run_id }}
          path: ${{ runner.temp }}/reviews-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload legacy verification browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth-legacy-browser-${{ github.run_id }}
          path: .qa/legacy-browser/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload AUTH-01 integrated browser acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auth01-integrated-browser-${{ github.run_id }}
          path: .qa/recovery-browser/
          if-no-files-found: ignore
